<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Gracias · We Will Rock You</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
    }

    body {
      min-width: 320px;
      color: #f6f2e9;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .page {
      width: min(100%, 980px);
      min-height: 100dvh;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 28px 28px 44px;
      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,.00) 0%,
          rgba(0,0,0,.02) 52%,
          rgba(0,0,0,.16) 72%,
          rgba(0,0,0,.58) 100%
        ),
        url("https://img.mailinblue.com/10009692/images/content_library/original/6aa29de04a47786a2956598b.gif") center top / contain no-repeat,
        #000;
      box-shadow: 0 0 80px rgba(0,0,0,.85);
    }

    .card {
      width: min(100%, 650px);
      margin: 0 auto;
      padding: 34px 34px 30px;
      position: relative;
      z-index: 1;
      text-align: center;
      border: 1px solid rgba(212,175,55,.58);
      background:
        radial-gradient(circle at 50% 0%, rgba(212,175,55,.08), transparent 30%),
        linear-gradient(180deg, rgba(10,11,13,.92), rgba(6,7,8,.97));
      box-shadow:
        0 24px 60px rgba(0,0,0,.48),
        inset 0 0 0 1px rgba(255,235,179,.035),
        0 0 24px rgba(212,175,55,.08);
      backdrop-filter: blur(4px);
    }

    h1 {
      margin: 0 0 20px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 7vw, 58px);
      font-weight: 400;
      line-height: 1;
      color: transparent;
      background: linear-gradient(
        180deg,
        #fff1bf 0%,
        #edc969 42%,
        #b37c23 72%,
        #e1b44d 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow: 0 2px 12px rgba(212,175,55,.08);
    }

    p {
      margin: 0 auto 18px;
      max-width: 560px;
      color: #e1dbd0;
      font-size: 16px;
      line-height: 1.65;
    }

    p:last-child {
      margin-bottom: 0;
      color: #bdb6aa;
    }

    @media (max-width: 680px) {
      .page {
        min-height: 100dvh;
        padding: 16px 16px 28px;
        background:
          linear-gradient(
            180deg,
            rgba(0,0,0,.00) 0%,
            rgba(0,0,0,.02) 50%,
            rgba(0,0,0,.14) 70%,
            rgba(0,0,0,.70) 100%
          ),
          url("https://img.mailinblue.com/10009692/images/content_library/original/6aa29de04a47786a2956598b.gif") center top / contain no-repeat,
          #000;
      }

      .card {
        padding: 30px 20px 26px;
      }

      p {
        font-size: 15px;
        line-height: 1.6;
      }
    }

    @media (min-width: 681px) {
      .card {
        margin-top: 62vh;
      }
    }

    @media (max-width: 680px) {
      .card {
        margin-top: 72vh;
      }
    }

  </style>
</head>

<body>
  <main class="page">
    <section class="card" aria-labelledby="gracias-title">
      <h1 id="gracias-title">Gracias</h1>

      <p>Hemos recibido tu solicitud. En breve recibirás un mail con la confirmación.</p>
</section>
  </main>
</body>
</html>
